<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
 
  <button id="theme-toggle" class="theme-toggle">🌙</button>

  <div class="logotipo">
    <img src="img/nexalogo.png" alt="Logo">
  </div>

  <div class="form">
    <img src="img/nexalogo.png" alt="Logo" class="logotipo-pequeno">
    <form id="cadastro-form" action="#">
      <div class="form-header">
        <div class="title">
          <h1>Cadastro</h1>
        </div>
      </div>

      <div class="input-group">
        <div class="input-box">
          <label for="fullname">Nome completo</label>
          <input type="text" id="fullname" name="fullname" placeholder="Digite seu nome completo" required>
        </div>

        <div class="gender-input">
          <div class="gender-title">
            <h3>Gênero</h3>
          </div>
          <div class="gender-group">
            <label for="gender-select" class="sr-only">Gênero</label>
            <select id="gender-select" name="gender" required>
              <option value="">Selecione</option>
              <option value="female">Feminino</option>
              <option value="male">Masculino</option>
              <option value="others">Outros</option>
              <option value="none">Prefiro não dizer</option>
            </select>
          </div>
        </div>

        <div class="input-box">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="input-box">
          <label for="number">Celular</label>
          <input type="tel" id="number" name="number" placeholder="(xx) xxxxx-xxxx" required>
        </div>

        <div class="input-box cpf-cep tight-pair">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required maxlength="11" inputmode="numeric" pattern="\d{11}" oninput="this.value=this.value.replace(/\D/g,'').slice(0,11)">
          <div class="erro" id="erro-cpf"></div>
        </div>

        <div class="input-box cpf-cep">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="Digite seu CEP" required maxlength="8" inputmode="numeric" pattern="\d{8}" oninput="this.value=this.value.replace(/\D/g,'').slice(0,8)">
          <div class="erro" id="erro-cep"></div>
        </div>

        <div class="input-box lift">
          <label for="endereco">Endereço (preenchido automaticamente)</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, Bairro, Cidade - UF" readonly>
        </div>

        <div class="input-box">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="Número" inputmode="numeric">
        </div>

        <div class="input-box">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, complemento (opcional)">
        </div>

        <div class="input-box lift">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Digite sua senha" required minlength="8">
          <div class="erro" id="erro-senha"></div>
        </div>

        <div class="input-box lift">
          <label for="confirmpassword">Confirme sua senha</label>
          <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirme sua senha" required>
          <div class="erro" id="erro-confirma"></div>
        </div>
      </div>

      <div class="continue-button lift">
        <button type="submit">Continuar</button>
      </div>
      <div class="have-account" style="text-align:center; margin-top:12px;">
        <p>Já tem conta? <a href="login.html">Faça login</a></p>
      </div>
      <div id="sucesso-msg" class="mensagem-sucesso" style="display: none;">Cadastro realizado com sucesso! Redirecionando para login...</div>
    </form>
  </div>

  <script>
    var botaoTemaCadastro = document.getElementById('theme-toggle');
    var corpo = document.body;
    if (botaoTemaCadastro) {
      if(localStorage.getItem('tema') == 'escuro') {
        corpo.classList.add('modo-escuro');
        botaoTemaCadastro.textContent = '\u2600\ufe0f';
      }
      botaoTemaCadastro.onclick = function() {
        corpo.classList.toggle('modo-escuro');
        if(corpo.classList.contains('modo-escuro')) {
          botaoTemaCadastro.textContent = '\u2600\ufe0f';
          localStorage.setItem('tema', 'escuro');
        } else {
          botaoTemaCadastro.textContent = '\ud83c\udf19';
          localStorage.setItem('tema', 'claro');
        }
      }
    }

    var formulario = document.getElementById('cadastro-form');
    var mensagemSucesso = document.getElementById('sucesso-msg');
    var inputCPF = document.getElementById('cpf');
    var inputCEP = document.getElementById('cep');
    var inputEndereco = document.getElementById('endereco');
    var erroCPF = document.getElementById('erro-cpf');
    var erroCEP = document.getElementById('erro-cep');
    var inputSenha = document.getElementById('password');
    var inputConfirma = document.getElementById('confirmpassword');
    var erroSenha = document.getElementById('erro-senha');
    var erroConfirma = document.getElementById('erro-confirma');

    function validarCPF(cpf) {
      if(!cpf) return false;
      cpf = cpf.replace(/[^0-9]/g, '');
      if(cpf.length !== 11) return false;
      if(/^(\d)\1{10}$/.test(cpf)) return false;
      var soma = 0;
      for(var i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
      var resto = soma % 11;
      var dig1 = (resto < 2) ? 0 : 11 - resto;
      if(parseInt(cpf.charAt(9)) !== dig1) return false;
      soma = 0;
      for(var j = 0; j < 10; j++) soma += parseInt(cpf.charAt(j)) * (11 - j);
      resto = soma % 11;
      var dig2 = (resto < 2) ? 0 : 11 - resto;
      if(parseInt(cpf.charAt(10)) !== dig2) return false;
      return true;
    }

    function buscarCEP(cep) {
      var cepLimpo = cep.replace(/\D/g, '');
      if(cepLimpo.length !== 8) {
        return Promise.reject(new Error('CEP inválido'));
      }
      return fetch('https://viacep.com.br/ws/' + cepLimpo + '/json/')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if(data.erro) throw new Error('CEP não encontrado');
          return data;
        });
    }

    if(inputCPF) {
      inputCPF.addEventListener('blur', function() {
        var val = inputCPF.value.replace(/\D/g, '');
        if(val.length === 0) {
          erroCPF.textContent = '';
          return;
        }
        var ok = validarCPF(inputCPF.value);
        if(!ok) {
          erroCPF.textContent = 'CPF inválido.';
        } else {
          erroCPF.textContent = '';
        }
      });
      inputCPF.addEventListener('input', function() {
        if(inputCPF.value.replace(/\D/g, '').length === 0) {
          erroCPF.textContent = '';
        }
      });
    }

    if(inputCEP) {
      inputCEP.addEventListener('blur', function() {
        var val = inputCEP.value.replace(/\D/g, '');
        if(val.length === 0) {
          erroCEP.textContent = '';
          inputEndereco.value = '';
          return;
        }
        buscarCEP(inputCEP.value).then(function(data) {
          inputEndereco.value = data.logradouro + ', ' + data.bairro + ', ' + data.localidade + ' - ' + data.uf;
          erroCEP.textContent = '';
        }).catch(function(err) {
          erroCEP.textContent = 'CEP inválido ou não encontrado.';
          inputEndereco.value = '';
        });
      });
      inputCEP.addEventListener('input', function() {
        if(inputCEP.value.replace(/\D/g, '').length === 0) {
          erroCEP.textContent = '';
        }
      });
    }

    function validarSenha(s) {
      if(!s) return false;
      if(s.length < 8) return false;
      if(!/[A-Z]/.test(s)) return false;
      if(!/[!@#\$%\^&\*\(\)\-_=+\[\]{};:'"\\|,.<>\/?`~]/.test(s)) return false;
      return true;
    }

    if(inputSenha) {
      inputSenha.addEventListener('blur', function() {
        var v = inputSenha.value;
        if(v.length === 0) { erroSenha.textContent = ''; return; }
        if(!validarSenha(v)) {
          erroSenha.textContent = 'Senha fraca. Mínimo 8 caracteres, 1 maiúscula e 1 caractere especial.';
        } else {
          erroSenha.textContent = '';
        }
      });
      inputSenha.addEventListener('input', function() { erroSenha.textContent = ''; });
    }

    if(inputConfirma) {
      inputConfirma.addEventListener('blur', function() {
        if(inputConfirma.value.length === 0) { erroConfirma.textContent = ''; return; }
        if(inputConfirma.value !== (inputSenha ? inputSenha.value : '')) {
          erroConfirma.textContent = 'As senhas não coincidem.';
        } else {
          erroConfirma.textContent = '';
        }
      });
      inputConfirma.addEventListener('input', function() { erroConfirma.textContent = ''; });
    }
    if(formulario) {
      formulario.onsubmit = function(e) {
        e.preventDefault();

        var cpfValido = true;
        var cepValido = true;

        if(inputCPF) {
          cpfValido = validarCPF(inputCPF.value);
          erroCPF.textContent = cpfValido ? '' : 'CPF inválido.';
        }

        if(inputCEP) {
          var cepLimpo = inputCEP.value.replace(/\D/g, '');
          if(cepLimpo.length !== 8) {
            cepValido = false;
            erroCEP.textContent = 'CEP inválido.';
          }
        }

        if(!cpfValido || !cepValido) {
          return;
        }

        var senhaOK = true;
        if(inputSenha) {
          senhaOK = validarSenha(inputSenha.value);
          erroSenha.textContent = senhaOK ? '' : 'Senha fraca. Mínimo 8 caracteres, 1 maiúscula e 1 caractere especial.';
        }
        if(inputConfirma) {
          var same = inputConfirma.value === inputSenha.value;
          erroConfirma.textContent = same ? '' : 'As senhas não coincidem.';
          if(!same) senhaOK = false;
        }
        if(!senhaOK) return;

        if(mensagemSucesso) {
          mensagemSucesso.style.display = 'block';
        }
        var btn = formulario.querySelector('button[type="submit"]');
        if(btn) { btn.disabled = true; }
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 900);
      }
    }
  </script>
</body>
</html>
